# Base PostgreSQL + PostGIS pour le développement local (Docker Desktop).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport
    ports:
      - "5433:5432"   # 5433 côté PC : évite le conflit avec un PostgreSQL déjà installé sur Windows
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
