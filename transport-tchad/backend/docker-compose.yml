# Base PostgreSQL + PostGIS pour le développement local (Docker Desktop).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: transport
      POSTGRES_DB: transport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
